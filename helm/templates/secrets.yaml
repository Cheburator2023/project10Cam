apiVersion: v1
kind: Secret
metadata:
  name: {{ include "camunda.fullname" . }}-secret
  labels: {{- include "camunda.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.secrets.immutable.enabled }}
immutable: true
{{- end }}
data:
  CAMUNDA_ADMIN: {{ default "" .Values.CAMUNDA_ADMIN | b64enc | quote }}
  CAMUNDA_PWD: {{ default "" .Values.CAMUNDA_PWD | b64enc | quote }}
  DB_USERNAME: {{ default "" .Values.db.DB_USERNAME | b64enc | quote }}
  DB_PASSWORD: {{ default "" .Values.db.DB_PASSWORD | b64enc | quote }}
  FLUENTD_USER: {{ default "" .Values.logging.fluentd.elasticsearch.user | b64enc | quote }}
  FLUENTD_PWD: {{ default "" .Values.logging.fluentd.elasticsearch.password | b64enc | quote }}