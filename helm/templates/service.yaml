apiVersion: v1
kind: Service
metadata:
  name: {{ include "camunda.fullname" . }}
  labels: {{- include "camunda.labels" . | nindent 4 }}
spec:
  ports:
    - name: 8000-tcp
      protocol: TCP
      port: 8000
      targetPort: 8000
    - name: 8080-tcp
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: 9404-tcp
      protocol: TCP
      port: 9404
      targetPort: 9404
    - name: 9990-tcp
      protocol: TCP
      port: 9990
      targetPort: 9990
  selector:
    app: {{ include "camunda.fullname" . }}
